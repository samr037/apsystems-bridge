<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="APsystems open bridge">
  <title>APsystems open bridge</title>

  <!-- Background plate -->
  <rect width="240" height="240" rx="20" fill="#0a0c0e"/>

  <!-- Grain / scanline overlay -->
  <defs>
    <pattern id="scan" x="0" y="0" width="2" height="3" patternUnits="userSpaceOnUse">
      <rect width="2" height="3" fill="transparent"/>
      <rect width="2" height="1" fill="#ffffff" opacity="0.020"/>
    </pattern>
    <radialGradient id="phosglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#69d97a" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#69d97a" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#69d97a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="solarG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd070"/>
      <stop offset="100%" stop-color="#ffba3d"/>
    </linearGradient>
  </defs>

  <!-- Phosphor glow halo -->
  <circle cx="120" cy="120" r="92" fill="url(#phosglow)"/>

  <!-- Concentric mesh rings (Zigbee radio waves) -->
  <g fill="none" stroke="#69d97a" stroke-opacity="0.22" stroke-width="1">
    <circle cx="120" cy="120" r="46"/>
    <circle cx="120" cy="120" r="68"/>
    <circle cx="120" cy="120" r="90" stroke-opacity="0.10"/>
  </g>

  <!-- Solar disc (centre) -->
  <circle cx="120" cy="120" r="22" fill="url(#solarG)"/>
  <circle cx="120" cy="120" r="22" fill="none" stroke="#ffba3d" stroke-width="0.6" opacity="0.6"/>

  <!-- Sun rays (8) -->
  <g stroke="#ffba3d" stroke-width="2.4" stroke-linecap="round">
    <line x1="120" y1="80"  x2="120" y2="68"/>
    <line x1="120" y1="160" x2="120" y2="172"/>
    <line x1="80"  y1="120" x2="68"  y2="120"/>
    <line x1="160" y1="120" x2="172" y2="120"/>
    <!-- diagonals -->
    <line x1="92"  y1="92"  x2="83"  y2="83"/>
    <line x1="148" y1="92"  x2="157" y2="83"/>
    <line x1="92"  y1="148" x2="83"  y2="157"/>
    <line x1="148" y1="148" x2="157" y2="157"/>
  </g>

  <!-- Three inverter nodes around the sun (YC600, YC600, DS3) -->
  <g>
    <!-- Top-right (YC600-1) -->
    <circle cx="180" cy="76"  r="6" fill="#69d97a"/>
    <circle cx="180" cy="76"  r="6" fill="none" stroke="#69d97a" stroke-opacity="0.4" stroke-width="6"/>
    <!-- Top-left (YC600-2) -->
    <circle cx="60"  cy="76"  r="6" fill="#69d97a"/>
    <circle cx="60"  cy="76"  r="6" fill="none" stroke="#69d97a" stroke-opacity="0.4" stroke-width="6"/>
    <!-- Bottom (DS3) -->
    <circle cx="120" cy="184" r="6" fill="#69d97a"/>
    <circle cx="120" cy="184" r="6" fill="none" stroke="#69d97a" stroke-opacity="0.4" stroke-width="6"/>
  </g>

  <!-- Mesh edges -->
  <g stroke="#69d97a" stroke-opacity="0.45" stroke-width="0.8" stroke-dasharray="3 3">
    <line x1="180" y1="76"  x2="120" y2="120"/>
    <line x1="60"  y1="76"  x2="120" y2="120"/>
    <line x1="120" y1="184" x2="120" y2="120"/>
    <line x1="180" y1="76"  x2="60"  y2="76"/>
    <line x1="180" y1="76"  x2="120" y2="184"/>
    <line x1="60"  y1="76"  x2="120" y2="184"/>
  </g>

  <!-- Corner tickmarks (mission-control framing) -->
  <g stroke="#f4f1ea" stroke-opacity="0.18" stroke-width="1" fill="none">
    <path d="M 14 14 L 14 32 M 14 14 L 32 14"/>
    <path d="M 226 14 L 226 32 M 226 14 L 208 14"/>
    <path d="M 14 226 L 14 208 M 14 226 L 32 226"/>
    <path d="M 226 226 L 226 208 M 226 226 L 208 226"/>
  </g>

  <!-- "APS" wordmark in monospace-style -->
  <g font-family="JetBrains Mono, Menlo, Consolas, monospace"
     font-weight="700" fill="#f4f1ea" letter-spacing="3">
    <text x="120" y="124" font-size="13"
          text-anchor="middle" dominant-baseline="middle">APS</text>
  </g>

  <!-- Subtle scanlines on top -->
  <rect width="240" height="240" rx="20" fill="url(#scan)"/>
</svg>
